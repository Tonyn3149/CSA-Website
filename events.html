    <div class="events-layout">
      <div class="events-inner">

        <!-- Calendar -->
        <div class="calendar-wrap">

            <div class="calendar-nav">

                <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
              </button>
            </div>
            <h2 class="calendar-month-title" id="cal-month-title">Loading…</h2>
            <div class="calendar-view-btns">
              <button class="cal-view-btn active" data-view="month">Month</button>
              <button class="cal-view-btn" data-view="week">Week</button>
            </div>
          </div>
          <div class="calendar-grid" id="calendar-grid">
            <!-- Populated by events.js -->
          </div>
        </div>

        <div class="calendar-divider"></div>

        <!-- Feed -->
        <div class="events-feed" id="events-feed">
          <!-- Populated by events.js -->
        </div>

      </div>
    </div>
